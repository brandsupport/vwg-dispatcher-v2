name: Validate Dispatcher backend foundation

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Worker API and D1 schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Worker JavaScript syntax
        working-directory: backend
        run: npm run check

      - name: Test API authentication and authorization
        working-directory: backend
        run: node --test tests/*.test.mjs

      - name: Test D1 schema constraints and append-only audit
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"
