name: Validate Dispatcher 2.0 UI foundation

on:
  push:
    branches: [main]
    paths:
      - "dashboard.js"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "dashboard.js"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard.js
      - name: Validate all application screens and safety labels
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('dashboard.js', 'utf8');
          const css = fs.readFileSync('dashboard.css', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const views = ['overview','live','tickets','brands','workflow','folders','team','my','roster','rules','reliability','audit','reports','admin'];
          for (const view of views) {
            const name = 'render' + view[0].toUpperCase() + view.slice(1);
            if (!js.includes('function ' + name + '(')) throw new Error('Missing screen renderer: ' + name);
            if (!html.includes('data-view="' + view + '"')) throw new Error('Missing navigation item: ' + view);
          }
          for (const text of ['globalSearch','periodSelect','folderSelect','DEMO DATA']) {
            if (!html.includes(text)) throw new Error('Missing application shell feature: ' + text);
          }
          for (const text of ['Audi','Škoda','Agency Detags','Transfers','Unadopts','Other / unclassified']) {
            if (!js.includes(text)) throw new Error('Missing dashboard category: ' + text);
          }
          if (!readme.toLowerCase().includes('first assignment') || !readme.toLowerCase().includes('first assigned to member')) throw new Error('Initial allocation-share definition is missing.');
          if (!js.includes('DEMONSTRATION DATA') || !js.includes('READ ONLY') || !js.includes('Not connected')) {
            throw new Error('Live Operations must clearly identify synthetic data and unavailable integrations.');
          }
          for (const text of ['liveFilteredTickets','liveInboxCards','liveStatusTabs','data-live-search','data-live-filter','data-live-status','data-live-folder','exportLiveQueue']) {
            if (!js.includes(text)) throw new Error('Live Operations feature missing: ' + text);
          }
          if (js.includes('data-action="toggle-dispatch"')) throw new Error('A simulated dispatch control must not be presented as an operational action.');
          for (const text of ['.live-queue-layout','.live-inbox-grid','.live-status-tab','.live-coverage-row']) {
            if (!css.includes(text)) throw new Error('Live Operations styling missing: ' + text);
          }
          const ageStart = js.indexOf('function liveAgeMinutes(ticket){');
          const ageEnd = js.indexOf('\n}', ageStart) + 2;
          const ageFunction = ageStart >= 0 && ageEnd > ageStart ? js.slice(ageStart, ageEnd) : '';
          if (!ageFunction) throw new Error('Live Operations age parser is missing.');
          const ageMinutes = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "5h 42m"})');
          if (ageMinutes !== 342) throw new Error('Live Operations age parser returned ' + ageMinutes + ' instead of 342.');
          const shortAge = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "18m"})');
          if (shortAge !== 18) throw new Error('Live Operations short age parser returned ' + shortAge + ' instead of 18.');
          if (!css.includes('.sidebar') || !css.includes('@media') || !css.includes('.modal-card')) {
            throw new Error('Responsive layout or ticket detail modal styles are missing.');
          }

          const overviewStart = js.indexOf('function renderOverview(){');
          const overviewEnd = js.indexOf('\nfunction healthRow(', overviewStart);
          const overview = overviewStart >= 0 && overviewEnd > overviewStart ? js.slice(overviewStart, overviewEnd) : '';
          for (const helper of ['overviewTrendData','overviewRiskSummary','overviewInboxSnapshot','overviewTeamPanel','overviewAllocationSummary','overviewIntegrationPanel']) {
            if (!js.includes('function ' + helper + '(')) throw new Error('Missing management overview component: ' + helper);
          }
          for (const text of ['MANAGEMENT COMMAND CENTRE','DEMONSTRATION DATA · READ ONLY','REOPENED TICKETS','Not connected','Initial allocation distribution','Source & platform readiness']) {
            if (!overview.includes(text)) throw new Error('Management overview disclosure or section missing: ' + text);
          }
          const readinessStart = js.indexOf('function overviewIntegrationPanel(');
          const readinessEnd = js.indexOf('\\nfunction renderOverview(', readinessStart);
          const readiness = readinessStart >= 0 && readinessEnd > readinessStart ? js.slice(readinessStart, readinessEnd) : '';
          if (!readiness.includes('Not configured') || !readiness.includes('Not connected')) throw new Error('Source readiness must disclose disconnected production integrations.');
          for (const stale of ['+8.4%','+5.2%','+11.6%','42 aged over 24h','Last heartbeat 10:42:18','Dispatcher engine","Running']) {
            if (overview.includes(stale)) throw new Error('Stale or unsupported Overview claim remains: ' + stale);
          }
          for (const text of ['.overview-demo-strip','.overview-metric-strip','.overview-inbox-grid','.overview-risk-list','.overview-team-list','.overview-final-note']) {
            if (!css.includes(text)) throw new Error('Management overview styling missing: ' + text);
          }
          const trendStart = js.indexOf('function overviewTrendData(');
          const trendEnd = js.indexOf('\nfunction ', trendStart + 10);
          const trendFunction = trendStart >= 0 && trendEnd > trendStart ? js.slice(trendStart, trendEnd) : '';
          const distributeStart = js.indexOf('function distribute(');
          const distributeEnd = js.indexOf('\nfunction ', distributeStart + 10);
          const distributeFunction = distributeStart >= 0 && distributeEnd > distributeStart ? js.slice(distributeStart, distributeEnd) : '';
          if (!trendFunction || !distributeFunction) throw new Error('Overview trend calculation helpers are missing.');
          const trendCheck = vm.runInNewContext(distributeFunction + '\n' + trendFunction + '; overviewTrendData(1284, 1086)');
          if (trendCheck.received.length !== 12 || trendCheck.resolved.length !== 12 || trendCheck.received.reduce((a,b)=>a+b,0)!==1284 || trendCheck.resolved.reduce((a,b)=>a+b,0)!==1086) {
            throw new Error('Overview interval distribution does not reconcile to the selected totals.');
          }
          if (overview.includes('smallChart([')) throw new Error('Old fixed, unscoped Overview trend remains.');

          console.log('Dispatcher 2.0 UI foundation validation passed: ' + views.length + ' screens.');
          NODE
