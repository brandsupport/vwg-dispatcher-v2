name: Validate Dispatcher 2.0 UI foundation

on:
  push:
    branches: [main]
    paths:
      - "dashboard.js"
      - "reporting-studio.html"
      - "reporting-studio.css"
      - "reporting-studio.js"
      - "examples/**"
      - "tests/**"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - "backend/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "dashboard.js"
      - "reporting-studio.html"
      - "reporting-studio.css"
      - "reporting-studio.js"
      - "examples/**"
      - "tests/**"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - "backend/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check backend Worker syntax
        working-directory: backend
        run: npm run check
      - name: Test backend API authentication and authorization
        working-directory: backend
        run: node --test tests/*.test.mjs
      - name: Test D1 migration and schema constraints
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard.js
      - name: Check offline reporting studio JavaScript syntax
        run: node --check reporting-studio.js
      - name: Test offline reporting sanitiser
        run: node --test tests/reporting-studio.test.mjs
      - name: Test dashboard local snapshot import validation
        run: node --test tests/dashboard-snapshot.test.mjs
      - name: Validate local-only reporting studio boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('reporting-studio.html', 'utf8');
          const js = fs.readFileSync('reporting-studio.js', 'utf8');
          const pages = fs.readFileSync('.github/workflows/pages.yml', 'utf8');
          for (const asset of ['reporting-studio.css', 'reporting-studio.js']) {
            if (!html.includes(asset)) throw new Error('Reporting Studio asset is not linked: ' + asset);
            if (!pages.includes(asset)) throw new Error('GitHub Pages workflow does not publish: ' + asset);
          }
          for (const file of ['examples/synthetic-ticket-snapshot.csv', 'examples/synthetic-assignment-history.csv', 'examples/synthetic-workflow-history.csv']) {
            if (!fs.existsSync(file)) throw new Error('Missing synthetic example: ' + file);
          }
          const outbound = /\b(fetch|XMLHttpRequest|WebSocket|EventSource)\b|sendBeacon|localStorage|sessionStorage|indexedDB|serviceWorker/i;
          if (outbound.test(js)) throw new Error('Reporting Studio must not make network calls or persist source data in browser storage.');
          for (const text of ['HMAC', 'SHA-256', 'normaliseWorkflowEvent', 'initial_assignments', 'current_open_workload']) {
            if (!js.includes(text)) throw new Error('Reporting Studio capability or safety guard missing: ' + text);
          }
          if (!html.includes('Local-only processing') || !html.includes('No file is uploaded')) {
            throw new Error('Reporting Studio privacy disclosure is missing.');
          }
          console.log('Reporting Studio isolation and packaging checks passed.');
          NODE
      - name: Validate all application screens and safety labels
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('dashboard.js', 'utf8');
          const css = fs.readFileSync('dashboard.css', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const studioHtml = fs.readFileSync('reporting-studio.html', 'utf8');
          const studioCss = fs.readFileSync('reporting-studio.css', 'utf8');
          for (const id of ['importSnapshotButton','snapshotFileInput','resetSnapshotButton','datasetBadge']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Dashboard snapshot import control is missing: ' + id);
          }
          for (const token of ['validateAndSanitiseSnapshot','loadLocalSnapshot','clearLocalSnapshot','dispatcher-reporting-snapshot-1','SANITISED LOCAL SNAPSHOT','snapshotQualityPanel']) {
            if (!js.includes(token)) throw new Error('Dashboard local snapshot capability or disclosure is missing: ' + token);
          }
          const dashboardOutbound = /\b(fetch\s*\(|new\s+XMLHttpRequest|new\s+WebSocket|sendBeacon|localStorage\s*\.|sessionStorage\s*\.|indexedDB\s*\.)/i;
          if (dashboardOutbound.test(js)) throw new Error('Public dashboard snapshot import must not use a network client or browser persistence.');
          for (const selector of ['.dataset-actions','.dataset-import-button','.dataset-reset-button']) {
            if (!css.includes(selector)) throw new Error('Dashboard snapshot import styling is missing: ' + selector);
          }
          for (const [name, page] of [['Dispatcher', html], ['Offline Studio', studioHtml]]) {
            if (!page.includes('class="brand-mark"') || !page.includes('class="logo-glow"') || !page.includes('class="logo-glyph"')) {
              throw new Error(name + ' is missing the Knowledge Base-style VW mark structure.');
            }
            if (page.includes('class="vw-roundel"') || page.includes('brand-symbol')) {
              throw new Error(name + ' is still using the previous logo treatment.');
            }
          }
          for (const [name, sheet] of [['Dispatcher', css], ['Offline Studio', studioCss]]) {
            if (!sheet.includes('--vw-logo: url("data:image/png;base64,') ||
                !sheet.includes('.brand-mark::after') ||
                !sheet.includes('@keyframes kb-brandmark-spin') ||
                !sheet.includes('var(--coral)') || !sheet.includes('var(--copper)')) {
              throw new Error(name + ' is missing the cloned Knowledge Base mark or warm Dispatcher accent treatment.');
            }
          }
          if (!html.includes('class="sidebar-studio-link"') || !html.includes('href="./reporting-studio.html"')) {
            throw new Error('The dashboard must provide a persistent link to the Reporting Studio.');
          }
          if (!studioHtml.includes('workspace-nav-button') || !studioHtml.includes('href="./"')) {
            throw new Error('The Reporting Studio must provide a clear return link to the dashboard.');
          }
          for (const token of ['--studio-accent:#ff174f','--studio-accent-soft:#ff5c91','--studio-plum:#c2a0ff','CHERRY GLASS — Reporting Studio']) {
            if (!studioCss.includes(token)) throw new Error('Reporting Studio Cherry Glass design token missing: ' + token);
          }
          for (const selector of ['.intro {','.step-card {','.button-primary {','.results-section {','.guardrails {','.workspace-nav-button']) {
            if (!studioCss.includes(selector)) throw new Error('Reporting Studio Cherry Glass styling missing: ' + selector);
          }
          if (!css.includes('Balanced typography and resilient dashboard layout') || !css.includes('font-size:15.2px !important')) {
            throw new Error('Dashboard balanced type scale is missing.');
          }
          if (!studioCss.includes('Balanced Studio type scale and overflow-safe content') || !studioCss.includes('font-size:15.8px !important')) {
            throw new Error('Reporting Studio balanced type scale is missing.');
          }
          if (!html.includes('© Designed and coded by') || !html.includes('class="footer-author">Momo</strong>')) {
            throw new Error('Dashboard signature footer or neon Momo credit is missing.');
          }
          if (!studioHtml.includes('© Designed and coded by') || !studioHtml.includes('class="studio-footer-author">Momo</strong>')) {
            throw new Error('Reporting Studio signature footer or neon Momo credit is missing.');
          }
          for (const [name, sheet] of [['Dispatcher', css], ['Offline Studio', studioCss]]) {
            if (!sheet.includes('linear-gradient(100deg,#ff174f 0%,#ff8eae 52%,#c2a0ff 100%)')) {
              throw new Error(name + ' footer author neon gradient is missing.');
            }
            if (!sheet.includes('overflow-wrap:anywhere')) throw new Error(name + ' overflow-safe text wrapping is missing.');
          }
          for (const [name, sheet] of [['Dispatcher', css], ['Offline Studio', studioCss]]) {
            const sizes = [...sheet.matchAll(/font-size\s*:\s*([\d.]+)px/g)].map(match => Number(match[1]));
            if (sizes.length && Math.min(...sizes) < 11) throw new Error(name + ' contains very small text (' + Math.min(...sizes) + 'px).');
          }
          const views = ['overview','live','tickets','brands','workflow','folders','team','my','roster','rules','reliability','audit','reports','admin'];
          for (const view of views) {
            const name = 'render' + view[0].toUpperCase() + view.slice(1);
            if (!js.includes('function ' + name + '(')) throw new Error('Missing screen renderer: ' + name);
            if (!html.includes('data-view="' + view + '"')) throw new Error('Missing navigation item: ' + view);
          }
          for (const text of ['globalSearch','periodSelect','folderSelect','DEMO DATA']) {
            if (!html.includes(text)) throw new Error('Missing application shell feature: ' + text);
          }
          for (const text of ['Audi','Škoda','Agency Detags','Transfers','Unadopts','Other / unclassified']) {
            if (!js.includes(text)) throw new Error('Missing dashboard category: ' + text);
          }
          if (!readme.toLowerCase().includes('first assignment') || !readme.toLowerCase().includes('first assigned to member')) throw new Error('Initial allocation-share definition is missing.');
          for (const text of ['Import snapshot','in memory only','ticket workbench remains synthetic-data-only','public, unauthenticated','Use demo']) {
            if (!readme.includes(text)) throw new Error('Local snapshot import boundary is missing from README: ' + text);
          }
          if (!js.includes('DEMONSTRATION DATA') || !js.includes('READ ONLY') || !js.includes('Not connected')) {
            throw new Error('Live Operations must clearly identify synthetic data and unavailable integrations.');
          }
          for (const text of ['liveFilteredTickets','liveInboxCards','liveStatusTabs','data-live-search','data-live-filter','data-live-status','data-live-folder','exportLiveQueue']) {
            if (!js.includes(text)) throw new Error('Live Operations feature missing: ' + text);
          }
          if (js.includes('data-action="toggle-dispatch"')) throw new Error('A simulated dispatch control must not be presented as an operational action.');
          for (const text of ['.live-queue-layout','.live-inbox-grid','.live-status-tab','.live-coverage-row']) {
            if (!css.includes(text)) throw new Error('Live Operations styling missing: ' + text);
          }
          const ageStart = js.indexOf('function liveAgeMinutes(ticket){');
          const ageEnd = js.indexOf('\n}', ageStart) + 2;
          const ageFunction = ageStart >= 0 && ageEnd > ageStart ? js.slice(ageStart, ageEnd) : '';
          if (!ageFunction) throw new Error('Live Operations age parser is missing.');
          const ageMinutes = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "5h 42m"})');
          if (ageMinutes !== 342) throw new Error('Live Operations age parser returned ' + ageMinutes + ' instead of 342.');
          const shortAge = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "18m"})');
          if (shortAge !== 18) throw new Error('Live Operations short age parser returned ' + shortAge + ' instead of 18.');
          if (!css.includes('.sidebar') || !css.includes('@media') || !css.includes('.modal-card')) {
            throw new Error('Responsive layout or ticket detail modal styles are missing.');
          }

          const overviewStart = js.indexOf('function renderOverview(){');
          const overviewEnd = js.indexOf('\nfunction healthRow(', overviewStart);
          const overview = overviewStart >= 0 && overviewEnd > overviewStart ? js.slice(overviewStart, overviewEnd) : '';
          for (const helper of ['overviewTrendData','overviewInboxSnapshot','overviewAllocationSummary']) {
            if (!js.includes('function ' + helper + '(')) throw new Error('Missing management overview component: ' + helper);
          }
          for (const text of ['MANAGEMENT PERFORMANCE','Performance overview','DEMONSTRATION DATA · READ ONLY','REOPENED TICKETS','Initial allocation distribution','Inbox performance','Brand demand','How to read this overview','NEED TO INSPECT OR WORK A TICKET?']) {
            if (!overview.includes(text)) throw new Error('Management overview disclosure or section missing: ' + text);
          }
          if (overview.includes('overviewRiskPanel(') || overview.includes('overviewTeamPanel()') || overview.includes('overviewIntegrationPanel()') || overview.includes('liveQueueRows()')) {
            throw new Error('Overview must stay at portfolio level and must not duplicate the ticket queue or live status panels.');
          }
          const liveStart = js.indexOf('function renderLive(){');
          const liveEnd = js.indexOf('\nfunction ticketQueueBase(', liveStart);
          const liveView = liveStart >= 0 && liveEnd > liveStart ? js.slice(liveStart, liveEnd) : '';
          for (const text of ['Queue-first control room','Working queue','Needs attention','Team coverage','Recent operational events']) {
            if (!liveView.includes(text)) throw new Error('Live Operations is missing its ticket-workbench distinction: ' + text);
          }
          const readinessStart = js.indexOf('function overviewIntegrationPanel(');
          const readinessEnd = js.indexOf('\nfunction renderOverview(', readinessStart);
          const readiness = readinessStart >= 0 && readinessEnd > readinessStart ? js.slice(readinessStart, readinessEnd) : '';
          if (!readiness.includes('Not configured') || !readiness.includes('Not connected')) throw new Error('Source readiness must disclose disconnected production integrations.');
          for (const stale of ['+8.4%','+5.2%','+11.6%','42 aged over 24h','Last heartbeat 10:42:18','Dispatcher engine","Running']) {
            if (overview.includes(stale)) throw new Error('Stale or unsupported Overview claim remains: ' + stale);
          }
          for (const text of ['.overview-demo-strip','.overview-metric-strip','.overview-inbox-grid','.overview-guide-list','.overview-next-step','.overview-final-note','.sidebar-studio-link']) {
            if (!css.includes(text)) throw new Error('Management overview styling missing: ' + text);
          }
          const trendStart = js.indexOf('function overviewTrendData(');
          const trendEnd = js.indexOf('\nfunction ', trendStart + 10);
          const trendFunction = trendStart >= 0 && trendEnd > trendStart ? js.slice(trendStart, trendEnd) : '';
          const distributeStart = js.indexOf('function distribute(');
          const distributeEnd = js.indexOf('\nfunction ', distributeStart + 10);
          const distributeFunction = distributeStart >= 0 && distributeEnd > distributeStart ? js.slice(distributeStart, distributeEnd) : '';
          if (!trendFunction || !distributeFunction) throw new Error('Overview trend calculation helpers are missing.');
          const trendCheck = vm.runInNewContext(distributeFunction + '\n' + trendFunction + '; overviewTrendData(1284, 1086)');
          if (trendCheck.received.length !== 12 || trendCheck.resolved.length !== 12 || trendCheck.received.reduce((a,b)=>a+b,0)!==1284 || trendCheck.resolved.reduce((a,b)=>a+b,0)!==1086) {
            throw new Error('Overview interval distribution does not reconcile to the selected totals.');
          }
          if (overview.includes('smallChart([')) throw new Error('Old fixed, unscoped Overview trend remains.');


          const ticketStart = js.indexOf('function renderTickets(){');
          const ticketEnd = js.indexOf('\nfunction chartPair(', ticketStart);
          const ticketView = ticketStart >= 0 && ticketEnd > ticketStart ? js.slice(ticketStart, ticketEnd) : '';
          for (const helper of ['ticketQueueBase','ticketStatusMatches','ticketPriority','ticketFilteredRows','ticketStatusCounts','ticketAgeingSummary','ticketStatusSummary','ticketLifecycleLedger','ticketTelemetryCard']) {
            if (!js.includes('function ' + helper + '(')) throw new Error('Missing Ticket Analytics component: ' + helper);
          }
          for (const text of ['TICKET FLOW INTELLIGENCE','DEMONSTRATION DATA · READ ONLY','REOPENED','Not available','AWAITING EVENT DATA','Ticket explorer','SAMPLE QUEUE ONLY']) {
            if (!ticketView.includes(text)) throw new Error('Ticket Analytics disclosure or section missing: ' + text);
          }
          for (const text of ['data-ticket-search','data-ticket-filter','data-ticket-status','reset-ticket-filters','export-tickets']) {
            if (!js.includes(text)) throw new Error('Ticket explorer interaction missing: ' + text);
          }
          for (const stale of ['12m','28m','3h 42m','2h 18m','46m','SAMPLE PROFILE','Resolution time distribution']) {
            if (ticketView.includes(stale)) throw new Error('Unsupported fixed Ticket Analytics metric remains: ' + stale);
          }
          for (const text of ['.ticket-demo-strip','.ticket-rate-strip','.ticket-analytics-primary','.ticket-ageing-summary','.ticket-telemetry-grid','.ticket-explorer-panel']) {
            if (!css.includes(text)) throw new Error('Ticket Analytics styling missing: ' + text);
          }
          const ticketAgeingStart = js.indexOf('function ticketAgeingSummary(');
          const ticketAgeingEnd = js.indexOf('\nfunction ', ticketAgeingStart + 10);
          const ticketAgeingFunction = ticketAgeingStart >= 0 && ticketAgeingEnd > ticketAgeingStart ? js.slice(ticketAgeingStart, ticketAgeingEnd) : '';
          if (!ticketAgeingFunction) throw new Error('Ticket age-band calculation is missing.');
          const ticketAgeingResult = vm.runInNewContext(ageFunction + String.fromCharCode(10) + ticketAgeingFunction + '; ticketAgeingSummary([{status:"Assigned",age:"30m"},{status:"Waiting",age:"2h"},{status:"Overdue",age:"5h"},{status:"Unassigned",age:"8h 15m"},{status:"Resolved",age:"9h"}])');
          if (ticketAgeingResult.under1h !== 1 || ticketAgeingResult.oneToFour !== 1 || ticketAgeingResult.fourToEight !== 1 || ticketAgeingResult.overEight !== 1 || ticketAgeingResult.total !== 4) {
            throw new Error('Ticket ageing bands did not correctly classify the unresolved sample records.');
          }
          const ticketPriorityStart = js.indexOf('function ticketPriority(');
          const ticketPriorityEnd = js.indexOf('\nfunction ', ticketPriorityStart + 10);
          const ticketPriorityFunction = ticketPriorityStart >= 0 && ticketPriorityEnd > ticketPriorityStart ? js.slice(ticketPriorityStart, ticketPriorityEnd) : '';
          const priorityResult = vm.runInNewContext(ticketPriorityFunction + '; [ticketPriority({status:"Overdue"}),ticketPriority({status:"Waiting"}),ticketPriority({status:"Assigned"})]');
          if (priorityResult.join(",") !== "High,Medium,Normal") throw new Error('Ticket priority mapping is incorrect.');


          const teamStart = js.indexOf('function renderTeam(){');
          const teamEnd = js.indexOf('\nfunction agentDetail(', teamStart);
          const teamView = teamStart >= 0 && teamEnd > teamStart ? js.slice(teamStart, teamEnd) : '';
          for (const text of ['TEAM PERFORMANCE INTELLIGENCE','DEMONSTRATION DATA · READ ONLY','Member snapshot','Current open-work distribution','First assignments by inbox','Member allocation matrix','Team-level workflow event ledger','NOT MEMBER-ATTRIBUTED']) {
            if (!teamView.includes(text)) throw new Error('Team Performance 2.0 section or disclosure missing: ' + text);
          }
          const teamEvidenceStart = js.indexOf('function teamEvidencePanel(');
          const teamEvidenceEnd = js.indexOf('\nfunction renderTeam(', teamEvidenceStart);
          const teamEvidence = teamEvidenceStart >= 0 && teamEvidenceEnd > teamEvidenceStart ? js.slice(teamEvidenceStart, teamEvidenceEnd) : '';
          if (!teamEvidence.includes('Not available')) throw new Error('Team evidence-gated measures must be clearly marked unavailable.');
          for (const text of ['.team-demo-strip','.team-profile-grid','.team-profile-card','.team-workload-row','.team-agent-detail','.team-event-ledger','.team-private-state','.team-evidence-list']) {
            if (!css.includes(text)) throw new Error('Team Performance styling missing: ' + text);
          }
          const agentDetailStart = js.indexOf('function agentDetail(');
          const personalStart = js.indexOf('\nfunction renderMy(', agentDetailStart);
          const agentDetail = agentDetailStart >= 0 && personalStart > agentDetailStart ? js.slice(agentDetailStart, personalStart) : '';
          if (!agentDetail || agentDetail.includes('First response') || agentDetail.includes('Elapsed resolution') || agentDetail.includes('a.response') || agentDetail.includes('a.resolution')) {
            throw new Error('Member detail must not display unsupported response or resolution timing.');
          }
          if (!teamView.includes('shareMatrix(matrix,true,matrix)')) throw new Error('Team allocation shares must use the complete first-assignment denominator.');
          const allocationShareStart = js.indexOf('function allocationShareData(');
          const allocationShareEnd = js.indexOf('\nfunction ', allocationShareStart + 10);
          const allocationShareFunction = allocationShareStart >= 0 && allocationShareEnd > allocationShareStart ? js.slice(allocationShareStart, allocationShareEnd) : '';
          const allocationShareResult = vm.runInNewContext(allocationShareFunction + '; allocationShareData([{id:"a",name:"A",cells:[10],handovers:99,reassignments:80,recoveries:70},{id:"b",name:"B",cells:[30],handovers:0,reassignments:0,recoveries:0}],0)');
          if (allocationShareResult.total !== 40 || allocationShareResult.rows[0].share !== 25 || allocationShareResult.rows[1].share !== 75) {
            throw new Error('Initial allocation share must use first-assigned counts only, not handover/reassignment/recovery events.');
          }
          const eventStart = js.indexOf('const WORKFLOW_EVENT_SUMMARY = [');
          const eventEnd = js.indexOf('];', eventStart) + 2;
          const eventDeclaration = eventStart >= 0 && eventEnd > eventStart ? js.slice(eventStart, eventEnd) : '';
          const workflowEvents = vm.runInNewContext(eventDeclaration + '; WORKFLOW_EVENT_SUMMARY');
          const expectedEvents = {handover:[128,96],flag:[88,72],manual:[55,49],recovery:[27,25],reassignment:[42,34]};
          if (workflowEvents.length !== 5 || workflowEvents.some(event => !expectedEvents[event.id] || event.events !== expectedEvents[event.id][0] || event.uniqueTickets !== expectedEvents[event.id][1])) {
            throw new Error('Team and Workflow Analytics must share the same event summary and unique-ticket counts.');
          }
          if (!js.includes('if(action==="export-team"){exportTeam();return;}') || !js.includes('dispatcher-sample-team-performance.csv')) {
            throw new Error('Team Performance sample export is missing.');
          }
          const myStart = js.indexOf('function renderMy(){');
          const myEnd = js.indexOf('\nfunction renderRoster(', myStart);
          const myView = myStart >= 0 && myEnd > myStart ? js.slice(myStart, myEnd) : '';
          if (!myView.includes('ACCESS NOT CONFIGURED') || !myView.includes('server-enforced') || myView.includes('Agent 04') || myView.includes('SAMPLE PROFILE')) {
            throw new Error('My Performance must remain private until authentication and server-side permissions are configured.');
          }
          if (!readme.includes('Team workload and event interpretation') || !readme.includes('The share denominator remains the full inbox first-assignment total')) {
            throw new Error('Team Performance metric definitions are missing from the README.');
          }


          const rosterStart = js.indexOf('function renderRoster(){');
          const rosterEnd = js.indexOf('\nfunction renderRules(', rosterStart);
          const rosterView = rosterStart >= 0 && rosterEnd > rosterStart ? js.slice(rosterStart, rosterEnd) : '';
          for (const text of ['ROSTER & COVERAGE INTELLIGENCE','DEMONSTRATION DATA · READ ONLY','Shift overlap map','Roster data readiness','Roster directory & inbox eligibility','Inbox eligibility matrix','Minimum headcount by interval','NO FALSE GAP ALERTS']) {
            if (!rosterView.includes(text)) throw new Error('Roster & Coverage 2.0 section or disclosure missing: ' + text);
          }
          for (const text of ['.roster-demo-strip','.roster-coverage-track','.roster-filter-toolbar','.roster-directory-panel','.roster-agent-detail','.roster-guardrail-list','.roster-final-note']) {
            if (!css.includes(text)) throw new Error('Roster & Coverage styling missing: ' + text);
          }
          if (!rosterView.includes('data-action="export-roster"') || !js.includes('dispatcher-sample-roster-coverage.csv')) {
            throw new Error('Roster & Coverage sample export is missing.');
          }
          if (rosterView.includes('data-action="roster-preview"') || js.includes('if(action==="roster-preview")')) {
            throw new Error('Roster preview must not imply that a sample edit can be applied.');
          }
          const clockStart = js.indexOf('function rosterClockMinutes(');
          const coverageEnd = js.indexOf('\nfunction rosterShiftSummary(', clockStart);
          const coverageCode = clockStart >= 0 && coverageEnd > clockStart ? js.slice(clockStart, coverageEnd) : '';
          if (!coverageCode.includes('function coverageSegments(')) throw new Error('Roster shift coverage calculation is missing.');
          const coverageResult = vm.runInNewContext(coverageCode + '; coverageSegments([{shift:"Early",start:"08:00",end:"18:00"},{shift:"Late",start:"10:00",end:"20:00"}])');
          const expectedSegments = [[480,600,1,0,1],[600,1080,1,1,2],[1080,1200,0,1,1]];
          if (coverageResult.length !== expectedSegments.length || coverageResult.some((segment,index) => {
            const expected = expectedSegments[index];
            return segment.start !== expected[0] || segment.end !== expected[1] || segment.early !== expected[2] || segment.late !== expected[3] || segment.headcount !== expected[4];
          })) {
            throw new Error('Roster overlap calculation failed for the sample early/late windows.');
          }
          const badCoverage = vm.runInNewContext(coverageCode + '; coverageSegments([{shift:"Early",start:"18:00",end:"08:00"},{shift:"Late",start:"10:00",end:"20:00"}])');
          if (badCoverage.length !== 1 || badCoverage[0].start !== 600 || badCoverage[0].end !== 1200) {
            throw new Error('Roster invalid or overnight shift boundaries were not handled safely.');
          }
          const gapCoverage = vm.runInNewContext(coverageCode + '; coverageSegments([{shift:"Early",start:"08:00",end:"10:00"},{shift:"Late",start:"11:00",end:"12:00"}])');
          if (gapCoverage.length !== 3 || gapCoverage[1].headcount !== 0 || gapCoverage[1].label !== "No sample shift coverage") {
            throw new Error('Roster coverage calculation must preserve zero-headcount gap intervals.');
          }
          const eligibilityStart = js.indexOf('const AGENTS = AGENT_NAMES.map(');
          const eligibilityEnd = js.indexOf('\n}));', eligibilityStart) + 5;
          const agentDeclaration = eligibilityStart >= 0 && eligibilityEnd > eligibilityStart ? js.slice(eligibilityStart, eligibilityEnd) : '';
          if (!agentDeclaration.includes('eligibleFolders: ["agency","detags","transfers","unadopts"]')) {
            throw new Error('Sample inbox eligibility must be explicit for all four inboxes.');
          }
          for (const text of ['untimestamped snapshots','minimum staffing targets','fortnightly rotations']) {
            if (!readme.toLowerCase().includes(text.toLowerCase())) throw new Error('Roster data limitation missing from README: ' + text);
          }

          const configStart = js.indexOf('function renderRules(){');
          const configEnd = js.indexOf('\nfunction configCard(', configStart);
          const configView = configStart >= 0 && configEnd > configStart ? js.slice(configStart, configEnd) : '';
          for (const text of ['DISPATCH CONFIGURATION 2.0','Proposed dispatch policy','Global allocation model','Workload weighting','Shift and availability eligibility','Four-inbox routing matrix','Recovery behaviour','Assignment safeguards','Safe scenario preview','Four-inbox eligibility baseline','Change governance and release gates','Production readiness checklist','Operational boundary','Not configured','Not connected','BLOCKED · NO BACKEND']) {
