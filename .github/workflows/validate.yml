name: Validate Dispatcher 2.0 UI foundation

on:
  push:
    branches: [main]
    paths:
      - "dashboard.js"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "dashboard.js"
      - "dashboard.css"
      - "index.html"
      - "README.md"
      - "docs/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard.js
      - name: Validate all application screens and safety labels
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('dashboard.js', 'utf8');
          const css = fs.readFileSync('dashboard.css', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const views = ['overview','live','tickets','brands','workflow','folders','team','my','roster','rules','reliability','audit','reports','admin'];
          for (const view of views) {
            const name = 'render' + view[0].toUpperCase() + view.slice(1);
            if (!js.includes('function ' + name + '(')) throw new Error('Missing screen renderer: ' + name);
            if (!html.includes('data-view="' + view + '"')) throw new Error('Missing navigation item: ' + view);
          }
          for (const text of ['globalSearch','periodSelect','folderSelect','DEMO DATA']) {
            if (!html.includes(text)) throw new Error('Missing application shell feature: ' + text);
          }
          for (const text of ['Audi','Škoda','Agency Detags','Transfers','Unadopts','Other / unclassified']) {
            if (!js.includes(text)) throw new Error('Missing dashboard category: ' + text);
          }
          if (!readme.toLowerCase().includes('first assignment') || !readme.toLowerCase().includes('first assigned to member')) throw new Error('Initial allocation-share definition is missing.');
          if (!js.includes('DEMONSTRATION DATA') || !js.includes('READ ONLY') || !js.includes('Not connected')) {
            throw new Error('Live Operations must clearly identify synthetic data and unavailable integrations.');
          }
          for (const text of ['liveFilteredTickets','liveInboxCards','liveStatusTabs','data-live-search','data-live-filter','data-live-status','data-live-folder','exportLiveQueue']) {
            if (!js.includes(text)) throw new Error('Live Operations feature missing: ' + text);
          }
          if (js.includes('data-action="toggle-dispatch"')) throw new Error('A simulated dispatch control must not be presented as an operational action.');
          for (const text of ['.live-queue-layout','.live-inbox-grid','.live-status-tab','.live-coverage-row']) {
            if (!css.includes(text)) throw new Error('Live Operations styling missing: ' + text);
          }
          const ageStart = js.indexOf('function liveAgeMinutes(ticket){');
          const ageEnd = js.indexOf('\n}', ageStart) + 2;
          const ageFunction = ageStart >= 0 && ageEnd > ageStart ? js.slice(ageStart, ageEnd) : '';
          if (!ageFunction) throw new Error('Live Operations age parser is missing.');
          const ageMinutes = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "5h 42m"})');
          if (ageMinutes !== 342) throw new Error('Live Operations age parser returned ' + ageMinutes + ' instead of 342.');
          const shortAge = vm.runInNewContext(ageFunction + '; liveAgeMinutes({age: "18m"})');
          if (shortAge !== 18) throw new Error('Live Operations short age parser returned ' + shortAge + ' instead of 18.');
          if (!css.includes('.sidebar') || !css.includes('@media') || !css.includes('.modal-card')) {
            throw new Error('Responsive layout or ticket detail modal styles are missing.');
          }

          const overviewStart = js.indexOf('function renderOverview(){');
          const overviewEnd = js.indexOf('\nfunction healthRow(', overviewStart);
          const overview = overviewStart >= 0 && overviewEnd > overviewStart ? js.slice(overviewStart, overviewEnd) : '';
          for (const helper of ['overviewTrendData','overviewRiskSummary','overviewInboxSnapshot','overviewTeamPanel','overviewAllocationSummary','overviewIntegrationPanel']) {
            if (!js.includes('function ' + helper + '(')) throw new Error('Missing management overview component: ' + helper);
          }
          for (const text of ['MANAGEMENT COMMAND CENTRE','DEMONSTRATION DATA · READ ONLY','REOPENED TICKETS','Not connected','Initial allocation distribution','Source & platform readiness']) {
            if (!overview.includes(text)) throw new Error('Management overview disclosure or section missing: ' + text);
          }
          const readinessStart = js.indexOf('function overviewIntegrationPanel(');
          const readinessEnd = js.indexOf('\nfunction renderOverview(', readinessStart);
          const readiness = readinessStart >= 0 && readinessEnd > readinessStart ? js.slice(readinessStart, readinessEnd) : '';
          if (!readiness.includes('Not configured') || !readiness.includes('Not connected')) throw new Error('Source readiness must disclose disconnected production integrations.');
          for (const stale of ['+8.4%','+5.2%','+11.6%','42 aged over 24h','Last heartbeat 10:42:18','Dispatcher engine","Running']) {
            if (overview.includes(stale)) throw new Error('Stale or unsupported Overview claim remains: ' + stale);
          }
          for (const text of ['.overview-demo-strip','.overview-metric-strip','.overview-inbox-grid','.overview-risk-list','.overview-team-list','.overview-final-note']) {
            if (!css.includes(text)) throw new Error('Management overview styling missing: ' + text);
          }
          const trendStart = js.indexOf('function overviewTrendData(');
          const trendEnd = js.indexOf('\nfunction ', trendStart + 10);
          const trendFunction = trendStart >= 0 && trendEnd > trendStart ? js.slice(trendStart, trendEnd) : '';
          const distributeStart = js.indexOf('function distribute(');
          const distributeEnd = js.indexOf('\nfunction ', distributeStart + 10);
          const distributeFunction = distributeStart >= 0 && distributeEnd > distributeStart ? js.slice(distributeStart, distributeEnd) : '';
          if (!trendFunction || !distributeFunction) throw new Error('Overview trend calculation helpers are missing.');
          const trendCheck = vm.runInNewContext(distributeFunction + '\n' + trendFunction + '; overviewTrendData(1284, 1086)');
          if (trendCheck.received.length !== 12 || trendCheck.resolved.length !== 12 || trendCheck.received.reduce((a,b)=>a+b,0)!==1284 || trendCheck.resolved.reduce((a,b)=>a+b,0)!==1086) {
            throw new Error('Overview interval distribution does not reconcile to the selected totals.');
          }
          if (overview.includes('smallChart([')) throw new Error('Old fixed, unscoped Overview trend remains.');


          const ticketStart = js.indexOf('function renderTickets(){');
          const ticketEnd = js.indexOf('\nfunction chartPair(', ticketStart);
          const ticketView = ticketStart >= 0 && ticketEnd > ticketStart ? js.slice(ticketStart, ticketEnd) : '';
          for (const helper of ['ticketQueueBase','ticketStatusMatches','ticketPriority','ticketFilteredRows','ticketStatusCounts','ticketAgeingSummary','ticketStatusSummary','ticketLifecycleLedger','ticketTelemetryCard']) {
            if (!js.includes('function ' + helper + '(')) throw new Error('Missing Ticket Analytics component: ' + helper);
          }
          for (const text of ['TICKET FLOW INTELLIGENCE','DEMONSTRATION DATA · READ ONLY','REOPENED','Not available','AWAITING EVENT DATA','Ticket explorer','SAMPLE QUEUE ONLY']) {
            if (!ticketView.includes(text)) throw new Error('Ticket Analytics disclosure or section missing: ' + text);
          }
          for (const text of ['data-ticket-search','data-ticket-filter','data-ticket-status','reset-ticket-filters','export-tickets']) {
            if (!js.includes(text)) throw new Error('Ticket explorer interaction missing: ' + text);
          }
          for (const stale of ['12m','28m','3h 42m','2h 18m','46m','SAMPLE PROFILE','Resolution time distribution']) {
            if (ticketView.includes(stale)) throw new Error('Unsupported fixed Ticket Analytics metric remains: ' + stale);
          }
          for (const text of ['.ticket-demo-strip','.ticket-rate-strip','.ticket-analytics-primary','.ticket-ageing-summary','.ticket-telemetry-grid','.ticket-explorer-panel']) {
            if (!css.includes(text)) throw new Error('Ticket Analytics styling missing: ' + text);
          }
          const ticketAgeingStart = js.indexOf('function ticketAgeingSummary(');
          const ticketAgeingEnd = js.indexOf('\nfunction ', ticketAgeingStart + 10);
          const ticketAgeingFunction = ticketAgeingStart >= 0 && ticketAgeingEnd > ticketAgeingStart ? js.slice(ticketAgeingStart, ticketAgeingEnd) : '';
          if (!ticketAgeingFunction) throw new Error('Ticket age-band calculation is missing.');
          const ticketAgeingResult = vm.runInNewContext(ageFunction + String.fromCharCode(10) + ticketAgeingFunction + '; ticketAgeingSummary([{status:"Assigned",age:"30m"},{status:"Waiting",age:"2h"},{status:"Overdue",age:"5h"},{status:"Unassigned",age:"8h 15m"},{status:"Resolved",age:"9h"}])');
          if (ticketAgeingResult.under1h !== 1 || ticketAgeingResult.oneToFour !== 1 || ticketAgeingResult.fourToEight !== 1 || ticketAgeingResult.overEight !== 1 || ticketAgeingResult.total !== 4) {
            throw new Error('Ticket ageing bands did not correctly classify the unresolved sample records.');
          }
          const ticketPriorityStart = js.indexOf('function ticketPriority(');
          const ticketPriorityEnd = js.indexOf('\nfunction ', ticketPriorityStart + 10);
          const ticketPriorityFunction = ticketPriorityStart >= 0 && ticketPriorityEnd > ticketPriorityStart ? js.slice(ticketPriorityStart, ticketPriorityEnd) : '';
          const priorityResult = vm.runInNewContext(ticketPriorityFunction + '; [ticketPriority({status:"Overdue"}),ticketPriority({status:"Waiting"}),ticketPriority({status:"Assigned"})]');
          if (priorityResult.join(",") !== "High,Medium,Normal") throw new Error('Ticket priority mapping is incorrect.');


          const teamStart = js.indexOf('function renderTeam(){');
          const teamEnd = js.indexOf('\nfunction agentDetail(', teamStart);
          const teamView = teamStart >= 0 && teamEnd > teamStart ? js.slice(teamStart, teamEnd) : '';
          for (const text of ['TEAM PERFORMANCE INTELLIGENCE','DEMONSTRATION DATA · READ ONLY','Member snapshot','Current open-work distribution','First assignments by inbox','Member allocation matrix','Team-level workflow event ledger','NOT MEMBER-ATTRIBUTED']) {
            if (!teamView.includes(text)) throw new Error('Team Performance 2.0 section or disclosure missing: ' + text);
          }
          const teamEvidenceStart = js.indexOf('function teamEvidencePanel(');
          const teamEvidenceEnd = js.indexOf('\nfunction renderTeam(', teamEvidenceStart);
          const teamEvidence = teamEvidenceStart >= 0 && teamEvidenceEnd > teamEvidenceStart ? js.slice(teamEvidenceStart, teamEvidenceEnd) : '';
          if (!teamEvidence.includes('Not available')) throw new Error('Team evidence-gated measures must be clearly marked unavailable.');
          for (const text of ['.team-demo-strip','.team-profile-grid','.team-profile-card','.team-workload-row','.team-agent-detail','.team-event-ledger','.team-private-state','.team-evidence-list']) {
            if (!css.includes(text)) throw new Error('Team Performance styling missing: ' + text);
          }
          const agentDetailStart = js.indexOf('function agentDetail(');
          const personalStart = js.indexOf('\nfunction renderMy(', agentDetailStart);
          const agentDetail = agentDetailStart >= 0 && personalStart > agentDetailStart ? js.slice(agentDetailStart, personalStart) : '';
          if (!agentDetail || agentDetail.includes('First response') || agentDetail.includes('Elapsed resolution') || agentDetail.includes('a.response') || agentDetail.includes('a.resolution')) {
            throw new Error('Member detail must not display unsupported response or resolution timing.');
          }
          if (!teamView.includes('shareMatrix(matrix,true,matrix)')) throw new Error('Team allocation shares must use the complete first-assignment denominator.');
          const allocationShareStart = js.indexOf('function allocationShareData(');
          const allocationShareEnd = js.indexOf('\nfunction ', allocationShareStart + 10);
          const allocationShareFunction = allocationShareStart >= 0 && allocationShareEnd > allocationShareStart ? js.slice(allocationShareStart, allocationShareEnd) : '';
          const allocationShareResult = vm.runInNewContext(allocationShareFunction + '; allocationShareData([{id:"a",name:"A",cells:[10],handovers:99,reassignments:80,recoveries:70},{id:"b",name:"B",cells:[30],handovers:0,reassignments:0,recoveries:0}],0)');
          if (allocationShareResult.total !== 40 || allocationShareResult.rows[0].share !== 25 || allocationShareResult.rows[1].share !== 75) {
            throw new Error('Initial allocation share must use first-assigned counts only, not handover/reassignment/recovery events.');
          }
          const eventStart = js.indexOf('const WORKFLOW_EVENT_SUMMARY = [');
          const eventEnd = js.indexOf('];', eventStart) + 2;
          const eventDeclaration = eventStart >= 0 && eventEnd > eventStart ? js.slice(eventStart, eventEnd) : '';
          const workflowEvents = vm.runInNewContext(eventDeclaration + '; WORKFLOW_EVENT_SUMMARY');
          const expectedEvents = {handover:[128,96],flag:[88,72],manual:[55,49],recovery:[27,25],reassignment:[42,34]};
          if (workflowEvents.length !== 5 || workflowEvents.some(event => !expectedEvents[event.id] || event.events !== expectedEvents[event.id][0] || event.uniqueTickets !== expectedEvents[event.id][1])) {
            throw new Error('Team and Workflow Analytics must share the same event summary and unique-ticket counts.');
          }
          if (!js.includes('if(action==="export-team"){exportTeam();return;}') || !js.includes('dispatcher-sample-team-performance.csv')) {
            throw new Error('Team Performance sample export is missing.');
          }
          const myStart = js.indexOf('function renderMy(){');
          const myEnd = js.indexOf('\nfunction renderRoster(', myStart);
          const myView = myStart >= 0 && myEnd > myStart ? js.slice(myStart, myEnd) : '';
          if (!myView.includes('ACCESS NOT CONFIGURED') || !myView.includes('server-enforced') || myView.includes('Agent 04') || myView.includes('SAMPLE PROFILE')) {
            throw new Error('My Performance must remain private until authentication and server-side permissions are configured.');
          }
          if (!readme.includes('Team workload and event interpretation') || !readme.includes('The share denominator remains the full inbox first-assignment total')) {
            throw new Error('Team Performance metric definitions are missing from the README.');
          }

          console.log('Dispatcher 2.0 UI foundation validation passed: ' + views.length + ' screens, including Team Performance 2.0 integrity checks.');
          NODE
