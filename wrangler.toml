name = "vwg-dispatcher-api"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
APP_ENV = "staging"

[[d1_databases]]
binding = "DB"
database_name = "vwg-dispatcher-staging"
database_id = "a634ae1e-e96f-4346-8a7d-864e3e44a581"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Configure these as Worker secrets after creating the Microsoft Entra app registration:
# MS_TENANT_ID
# MS_CLIENT_ID
# MS_CLIENT_SECRET
#
# Do not commit tokens, client secrets, mailbox credentials or real user data.
